<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>我們的聖誕幸運日曆 🎄</title><style>*{box-sizing:border-box}body{margin:0;background:#103c34;color:#fff6e8;font-family:system-ui,"Noto Sans TC",sans-serif;text-align:center}header{padding:48px 15px 24px;background:radial-gradient(ellipse at top,#2a6757,#103c34)}h1{font-size:clamp(30px,6vw,54px);margin:12px}p{line-height:1.7}.tag{color:#f2cf91;letter-spacing:3px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:800px;margin:25px auto;padding:12px}.door{background:linear-gradient(145deg,#ad4a4b,#7f2d37);border:2px solid #e7c37d;color:#fff7e7;min-height:100px;border-radius:13px;font-size:30px;cursor:pointer;box-shadow:0 5px 0 #08251f}.door:disabled{opacity:.48;cursor:not-allowed}.door.opened{background:#d6b876;color:#163a32}dialog{max-width:min(92vw,500px);border:2px solid #d9b16d;border-radius:20px;background:#fff8ec;color:#234339;padding:26px;box-shadow:0 20px 80px #0008}dialog::backdrop{background:#071c19ba}button{font:inherit}dialog button,.action{padding:12px 20px;border:0;border-radius:30px;background:#a54249;color:white;margin:8px;cursor:pointer}.coupon{border:2px dashed #bb9959;border-radius:14px;padding:18px;margin:18px 0;background:#fff0d6}footer{padding:25px;color:#dfcfb6;font-size:13px}#wallet{max-width:800px;margin:auto;padding:20px}#coupons{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ticket{background:#f9f0db;color:#234339;padding:16px;border-radius:12px}.ticket.used{opacity:.5}@media(min-width:650px){.grid{grid-template-columns:repeat(6,1fr)}} </style><header><div class="tag">OUR LITTLE CHRISTMAS · 2026</div><h1>🎄 我們的聖誕幸運日曆</h1><p>每天一件好事，收集一份可以向對方兌換的幸福。<br>12 月 1 日至 24 日，每天開一扇小門 ✨</p><p id="count"></p></header><main><section class="grid" id="grid"></section><section id="wallet"><h2>🎟️ 我的幸運禮物券</h2><p>禮物保存在這台裝置的瀏覽器中。兌換時請讓對方確認 💌</p><div id="coupons"></div></section></main><dialog id="pop"><h2 id="daytitle"></h2><h3>🌱 今天的一件好事</h3><p id="good"></p><div class="coupon"><h3>🎁 今日幸運禮物</h3><p id="gift"></p></div><div id="buttons"></div><button onclick="pop.close()">關閉</button></dialog><footer>Made for two, with love ♡ · 每一份心意都值得珍藏</footer><script>const goods=["真心稱讚對方一件小事","主動幫對方做一件家事","寫下今天最感謝的事情","向一位朋友送上關心","替對方準備一杯喜歡的飲料","分享一首讓你想到對方的歌","今天認真聽對方說十分鐘","把一句鼓勵送給需要的人","一起整理一個小角落","給對方一個長長的擁抱","分享一張美好回憶照片","主動說出一次謝謝","替對方安排十分鐘休息","做一件對地球友善的事","寫下一個共同的夢想","今天不滑手機好好吃一餐","幫對方完成一件小麻煩","對陌生人釋出一點善意","分享今天遇到的幸運","一起散步看夜晚的燈光","寫下對方的三個優點","為明天準備一個小驚喜","一起回顧今年最幸福的瞬間","親口說：有你真好"];const gifts=["十分鐘肩頸按摩券","指定飲料請客券","今天由我洗碗券","專屬電影選片權","暖心手寫卡片券","一起吃甜點券","睡前故事券","一個願望小幫手券","專屬拍照攝影師券","晚餐菜單決定權","二十分鐘陪伴散步券","早安擁抱券","今天不用做家事券","你選歌我陪聽券","驚喜早餐券","一小時不滑手機約會券","專屬誇誇五連發券","任選一項小任務代勞券","指定小點心券","一起看星星券","溫柔鼓勵語音券","回憶照片沖印券","一次約會行程決定權","聖誕特別願望兌換券"];const key="advent-2026";let state=JSON.parse(localStorage.getItem(key)||'{}');const save=()=>localStorage.setItem(key,JSON.stringify(state));const now=new Date(),today=(now.getFullYear()===2026&&now.getMonth()===11)?now.getDate():0;const days=Math.max(0,Math.ceil((new Date(2026,11,25)-now)/86400000));document.getElementById("count").textContent=now<new Date(2026,11,1)?"距離開箱日還有 "+Math.ceil((new Date(2026,11,1)-now)/86400000)+" 天":days?"距離聖誕節還有 "+days+" 天":"Merry Christmas! 🎅";function render(){grid.innerHTML="";for(let i=1;i<=24;i++){const b=document.createElement("button");b.className="door"+(state[i]?" opened":"");b.textContent=state[i]?"🎁":i;b.disabled=now.getFullYear()<2026||(now.getFullYear()===2026&&now.getMonth()<11)||(now.getFullYear()===2026&&now.getMonth()===11&&i>today);b.onclick=()=>show(i);grid.append(b)}coupons.innerHTML="";Object.keys(state).sort((a,b)=>a-b).forEach(i=>{const t=document.createElement("div");t.className="ticket"+(state[i]==="used"?" used":"");t.innerHTML="<b>Day "+i+" · "+gifts[i-1]+"</b><p>"+(state[i]==="used"?"已兌換 ✓":"待兌換 🎟️")+"</p>";const b=document.createElement("button");b.className="action";b.textContent=state[i]==="used"?"恢復未兌換":"標記已兌換";b.onclick=()=>{state[i]=state[i]==="used"?"saved":"used";save();render()};t.append(b);coupons.append(t)})}function show(i){daytitle.textContent="12 月 "+i+" 日 ✨";good.textContent=goods[i-1];gift.textContent=gifts[i-1];buttons.innerHTML="";const b=document.createElement("button");b.textContent=state[i]?"已收藏 ✓":"完成好事，領取幸運券";b.disabled=!!state[i];b.onclick=()=>{state[i]="saved";save();render();show(i)};buttons.append(b);const share=document.createElement("button");share.textContent="💌 分享給對方";share.onclick=()=>{const msg="🎄 第 "+i+" 天的聖誕幸運券："+gifts[i-1]+"。想跟你兌換這份幸福！";if(navigator.share)navigator.share({text:msg}).catch(()=>{});else navigator.clipboard.writeText(msg).then(()=>alert("兌換訊息已複製"))};buttons.append(share);pop.showModal()}render();</script></html>
